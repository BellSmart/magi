[project]
name = "magi"
version = "0.1.0"
description = "MAGI — three-persona voting oracle, public deployment edition"
# Ubuntu 22.04 自带 Python 3.10，24.04 是 3.12，两者都要能跑。
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    # app/credentials.py 用 AES-GCM 加密用户自带的 API key；缺了它服务起不来。
    "cryptography>=42",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
