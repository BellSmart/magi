<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGI — 履歴</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #05070a; color: #c8b28a;
      font-family: 'Lucida Console', ui-monospace, monospace;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 16px; border-bottom: 2px solid #ff8d00; background: #0a0602;
      position: sticky; top: 0; z-index: 5;
    }
    header a { color: #ff8d00; text-decoration: none; letter-spacing: .1em; }
    header a:hover { text-decoration: underline; }
    header h1 { margin: 0; font-size: 14px; font-weight: normal; color: #ff8d00; letter-spacing: .35em; }
    header .spacer { margin-left: auto; }
    header .who { font-size: 12px; color: #6b573a; }
    .clear-all {
      background: transparent; border: 1px solid #5a1a1a; color: #a41413;
      font-family: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    }
    .clear-all:hover { background: #a41413; color: #05070a; border-color: #a41413; }

    .grid { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 0; height: calc(100vh - 44px); }
    .list { overflow: auto; border-right: 1px solid #2a1a08; }
    .detail { overflow: auto; padding: 16px; }

    details.day { border-bottom: 1px solid #1d1206; }
    details.day > summary {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; cursor: pointer; list-style: none;
      background: #0c0703; color: #ff8d00; font-size: 12px; letter-spacing: .1em;
      position: sticky; top: 0; z-index: 2;
    }
    details.day > summary::-webkit-details-marker { display: none; }
    details.day > summary::before {
      content: '▶'; font-size: 9px; color: #8a4a08; transition: transform .12s;
    }
    details.day[open] > summary::before { transform: rotate(90deg); }
    details.day > summary:hover { background: #150c03; }
    details.day > summary .count { margin-left: auto; color: #6b573a; font-size: 11px; }

    .item { padding: 9px 12px 9px 26px; border-top: 1px solid #150c04; cursor: pointer; position: relative; }
    .item:hover { background: #130b02; }
    .item.active { background: #170d03; box-shadow: inset 3px 0 0 #ff8d00; }
    .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .verdict { font-weight: bold; font-size: 13px; }
    .time { margin-left: auto; font-size: 11px; color: #6b573a; }
    .tally { font-size: 11px; color: #8a7350; margin-bottom: 3px; }
    .text { font-size: 12px; color: #9a8258; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .del {
      position: absolute; right: 8px; top: 8px; visibility: hidden;
      background: transparent; border: 1px solid #5a1a1a; color: #a41413;
      font-family: inherit; font-size: 10px; padding: 1px 6px; cursor: pointer;
    }
    .item:hover .del { visibility: visible; }
    .del:hover { background: #a41413; color: #05070a; }

    .empty { color: #6b573a; font-size: 13px; padding: 20px; }

    .open-console {
      display: inline-block; margin-bottom: 12px; padding: 4px 12px;
      color: #ff8d00; border: 1px solid #8a4a08; text-decoration: none; font-size: 12px;
      letter-spacing: .1em;
    }
    .open-console:hover { background: #ff8d00; color: #05070a; }

    .qtext { white-space: pre-wrap; border-left: 2px solid #ff8d00; padding-left: 10px; margin-bottom: 12px; color: #d8c49c; }
    .meta { font-size: 12px; color: #8a7350; margin-bottom: 14px; }
    .run { border-top: 1px solid #211407; padding-top: 10px; margin-top: 10px; }
    .run-head { display: flex; gap: 10px; align-items: baseline; font-size: 12px; margin-bottom: 6px; }
    .run-name { color: #ff8d00; font-size: 13px; }
    .run-status { font-weight: bold; }
    .run-meta { color: #6b573a; margin-left: auto; font-size: 11px; }
    .run-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #c8b28a; }
    .sources { margin-top: 16px; border-top: 1px solid #211407; padding-top: 10px; }
    .sources h3 { margin: 0 0 8px; font-size: 12px; color: #ff8d00; letter-spacing: .25em; font-weight: normal; }
    .sources ol { margin: 0; padding-left: 20px; }
    .sources li { margin-bottom: 6px; font-size: 12px; }
    .sources a { color: #ff8d00; text-decoration: none; }
    .sources a:hover { text-decoration: underline; }
    .sources .snip { display: block; color: #6b573a; }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; height: auto; }
      .list { max-height: 45vh; border-right: none; border-bottom: 1px solid #2a1a08; }
      .detail { height: auto; }
    }
  </style>
</head>
<body>
<header>
  <a href="/">← MAGI</a>
  <h1>履 歴</h1>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="clear-all" id="clear-all" type="button">すべて削除</button>
</header>

<div class="grid">
  <section class="list" id="list"><div class="empty">読み込み中…</div></section>
  <section class="detail" id="detail"><div class="empty">左の記録を選択してください</div></section>
</div>

<script>
const LABEL = {
  yes: '合 意', no: '拒 絶', conditional: '状 態',
  info: '情 報', error: '誤 差', abstain: '棄 権', processing: '処 理 中',
};
const COLOR = {
  yes: '#52e691', no: '#a41413', conditional: '#ff8d00',
  info: '#3caee0', error: 'gray', abstain: '#6b7280', processing: '#6b573a',
};
const WEEKDAY = ['日', '月', '火', '水', '木', '金', '土'];

const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
let csrf = null;
let currentId = null;

const pad = (n) => String(n).padStart(2, '0');

function fmtTime(iso) {
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function dayKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function dayLabel(d) {
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAY[d.getDay()]}）`;
}

function tallyText(tally) {
  return Object.entries(tally || {})
    .map(([k, v]) => `${LABEL[k] || k}×${v}`)
    .join('  ');
}

// --- 一覧 ------------------------------------------------------------------

function buildItem(item) {
  const node = document.createElement('div');
  node.className = 'item';
  node.dataset.id = item.id;

  const row1 = document.createElement('div');
  row1.className = 'row1';
  const verdict = document.createElement('span');
  verdict.className = 'verdict';
  verdict.textContent = LABEL[item.status] || item.status;
  verdict.style.color = COLOR[item.status] || '#6b573a';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = fmtTime(item.created_at);
  row1.append(verdict, time);

  const tally = document.createElement('div');
  tally.className = 'tally';
  tally.textContent = tallyText(item.tally) || '—';

  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = item.text;

  const del = document.createElement('button');
  del.className = 'del';
  del.type = 'button';
  del.textContent = '削 除';
  del.addEventListener('click', (event) => {
    event.stopPropagation();
    removeOne(item.id, node);
  });

  node.append(del, row1, tally, text);
  node.addEventListener('click', () => select(item.id, node));
  return node;
}

function renderList(items) {
  listEl.textContent = '';
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '履歴はまだありません';
    listEl.appendChild(empty);
    return;
  }

  const todayKey = dayKey(new Date());
  const groups = new Map();
  items.forEach((item) => {
    const d = new Date(item.created_at);
    const key = dayKey(d);
    if (!groups.has(key)) groups.set(key, { date: d, key, items: [] });
    groups.get(key).items.push(item);
  });

  groups.forEach((group) => {
    const details = document.createElement('details');
    details.className = 'day';
    details.open = group.key === todayKey;

    const summary = document.createElement('summary');
    const label = document.createElement('span');
    label.textContent = dayLabel(group.date);
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${group.items.length} 件`;
    summary.append(label, count);

    details.appendChild(summary);
    group.items.forEach((item) => details.appendChild(buildItem(item)));
    listEl.appendChild(details);
  });
}

// --- 詳細 ------------------------------------------------------------------

function runBlock(run) {
  const block = document.createElement('div');
  block.className = 'run';

  const head = document.createElement('div');
  head.className = 'run-head';
  const name = document.createElement('span');
  name.className = 'run-name';
  name.textContent = run.display;
  const st = document.createElement('span');
  st.className = 'run-status';
  st.textContent = LABEL[run.status] || run.status;
  st.style.color = COLOR[run.status] || '#6b573a';
  const meta = document.createElement('span');
  meta.className = 'run-meta';
  const bits = [`${run.latency_ms || 0}ms`, run.model];
  if (run.cache_hit_rate) bits.push(`缓存 ${run.cache_hit_rate}%`);
  if (run.cost_yuan) bits.push(`¥${Number(run.cost_yuan).toFixed(4)}`);
  meta.textContent = bits.join('  ·  ');
  head.append(name, st, meta);

  const body = document.createElement('div');
  body.className = 'run-body';
  body.textContent = run.answer || run.error || '—';

  block.append(head, body);
  return block;
}

function renderDetail(data) {
  detailEl.textContent = '';

  const open = document.createElement('a');
  open.className = 'open-console';
  open.href = `/?view=${data.id}`;
  open.textContent = '主画面で開く →';
  detailEl.appendChild(open);

  const q = document.createElement('div');
  q.className = 'qtext';
  q.textContent = data.text;
  detailEl.appendChild(q);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const cost = (data.runs || []).reduce((sum, r) => sum + (r.cost_yuan || 0), 0);
  meta.textContent = [
    LABEL[data.status] || data.status,
    `form=${data.form || '?'}`,
    `思考=${data.reasoning_effort || '?'}`,
    `${data.latency_ms || 0} ms`,
    `¥${cost.toFixed(4)}`,
    new Date(data.created_at).toLocaleString(),
  ].join('   ·   ');
  detailEl.appendChild(meta);

  (data.runs || []).forEach((run) => detailEl.appendChild(runBlock(run)));

  if ((data.sources || []).length) {
    const box = document.createElement('div');
    box.className = 'sources';
    const title = document.createElement('h3');
    title.textContent = '参 考 資 料';
    const list = document.createElement('ol');
    data.sources.forEach((src) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = src.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = src.title || src.url;
      const snip = document.createElement('span');
      snip.className = 'snip';
      snip.textContent = src.snippet || '';
      li.append(a, snip);
      list.appendChild(li);
    });
    box.append(title, list);
    detailEl.appendChild(box);
  }
}

async function select(id, node) {
  currentId = id;
  document.querySelectorAll('.item.active').forEach((el) => el.classList.remove('active'));
  if (node) node.classList.add('active');
  const response = await fetch(`/api/questions/${id}`);
  if (!response.ok) {
    detailEl.textContent = '';
    const err = document.createElement('div');
    err.className = 'empty';
    err.textContent = '取得できませんでした';
    detailEl.appendChild(err);
    return;
  }
  renderDetail(await response.json());
  history.replaceState(null, '', `#${id}`);
}

// --- 削除 ------------------------------------------------------------------

async function removeOne(id, node) {
  if (!window.confirm('この記録を削除します。よろしいですか？')) return;
  const response = await fetch(`/api/questions/${id}`, {
    method: 'DELETE',
    headers: { 'X-CSRF-Token': csrf },
  });
  if (!response.ok) { window.alert('削除に失敗しました'); return; }

  const group = node.closest('details');
  node.remove();
  if (group) {
    const remaining = group.querySelectorAll('.item').length;
    if (remaining === 0) {
      group.remove();
    } else {
      group.querySelector('.count').textContent = `${remaining} 件`;
    }
  }

  if (currentId === id) {
    currentId = null;
    detailEl.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '左の記録を選択してください';
    detailEl.appendChild(empty);
  }

  if (!listEl.querySelector('.item')) {
    listEl.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '履歴はまだありません';
    listEl.appendChild(empty);
  }
}

async function clearAll() {
  if (!listEl.querySelector('.item')) return;
  const count = listEl.querySelectorAll('.item').length;
  if (!window.confirm(`${count} 件の履歴をすべて削除します。元に戻せません。`)) return;

  const response = await fetch('/api/questions', {
    method: 'DELETE',
    headers: { 'X-CSRF-Token': csrf },
  });
  if (!response.ok) { window.alert('削除に失敗しました'); return; }
  boot(true);
}

// --- 起動 ------------------------------------------------------------------

async function boot(silent) {
  const me = await fetch('/api/me');
  if (!me.ok) { location.replace('/login'); return; }
  const meData = await me.json();
  csrf = meData.csrf_token;
  document.getElementById('who').textContent = meData.user.username;

  const response = await fetch('/api/questions?limit=200');
  if (!response.ok) {
    listEl.textContent = '';
    const err = document.createElement('div');
    err.className = 'empty';
    err.textContent = '履歴を取得できませんでした';
    listEl.appendChild(err);
    return;
  }
  const data = await response.json();
  renderList(data.items);

  if (silent) {
    detailEl.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '左の記録を選択してください';
    detailEl.appendChild(empty);
    return;
  }

  const target = location.hash.slice(1);
  if (target) {
    const node = document.querySelector(`.item[data-id="${target}"]`);
    if (node) select(target, node);
  }
}

document.getElementById('clear-all').addEventListener('click', clearAll);
boot(false);
</script>
</body>
</html>
