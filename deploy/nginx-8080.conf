# MAGI 站点（无域名 / 80、443 被机房拦截时用这个，监听 8080）。
#
# 与 nginx-tls.conf 的区别：没有 TLS，也没有 80 端口的 ACME 引导；
# 适用场景是主机商对 80/443 做了未备案拦截、IP 证书签不下来的机器。
# 详情见 deploy/README.md 的「没有备案域名怎么办」。

server {
    listen 8080;
    server_name _;

    include snippets/magi-security.conf;

    client_max_body_size 256k;

    # SSE 必须关闭缓冲，否则逐票事件会攒到最后一起到达。
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 登录：单独限速，挡口令爆破。login_limit 定义在 00-magi-limits.conf。
    location = /api/auth/login {
        limit_req zone=magi_login burst=5 nodelay;
        limit_conn magi_conn 10;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # 提问：一次调用三家模型，最贵的入口。
    location = /api/questions {
        limit_req zone=magi_ask burst=3 nodelay;
        limit_conn magi_conn 10;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=magi_all burst=40 nodelay;
        limit_conn magi_conn 20;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}
