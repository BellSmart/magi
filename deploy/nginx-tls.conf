# MAGI 正式站点配置。__IP__ 会被 enable-tls.sh 替换为公网 IP。
#
# 没有域名，因此用 Let's Encrypt 的 IP 地址证书。IP 证书只能是 6 天有效期的
# shortlived 档，续期频率高——所以 80 端口必须长期可用（续期校验走这里）。
#
# 限速区与安全头分别来自 conf.d/00-magi-limits.conf 与 snippets/magi-security.conf，
# 由 deploy/harden.sh（install.sh 也会装）落盘。

server {
    listen 80;
    server_name _;

    include snippets/magi-security.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    include snippets/magi-security.conf;

    ssl_certificate     /etc/letsencrypt/live/__IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MAGI:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    client_max_body_size 256k;

    # SSE 必须关闭缓冲，否则逐票事件会攒到最后一起到达。
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/auth/login {
        limit_req zone=magi_login burst=5 nodelay;
        limit_conn magi_conn 10;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/questions {
        limit_req zone=magi_ask burst=3 nodelay;
        limit_conn magi_conn 10;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=magi_all burst=40 nodelay;
        limit_conn magi_conn 20;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }
}
