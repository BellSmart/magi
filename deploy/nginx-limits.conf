# MAGI 全局限速与超时（http 上下文，install 到 conf.d/00-magi-limits.conf）。
#
# 目的：把「公网上被脚本扫、被单个 IP 刷」的成本压到很低。真正的流量型 DDoS
# 在单机上挡不住，那要靠机房清洗或 Cloudflare；这里挡的是应用层洪水与慢连接。

# --- 限速区 -----------------------------------------------------------------
# 全站：每人 20 r/s，突发 40，够正常页面与 SSE 用。
limit_req_zone $binary_remote_addr zone=magi_all:10m rate=20r/s;
# 登录：正常用户一分钟点不了几次，这里给 10 次/分，防口令爆破。
limit_req_zone $binary_remote_addr zone=magi_login:10m rate=10r/m;
# 提问：每问一次要调三家模型，最贵的入口，限到 6 次/分。
limit_req_zone $binary_remote_addr zone=magi_ask:10m rate=6r/m;
# 并发连接数：浏览器开 SSE 会占 1-2 条，20 条足够，扫器别想开几千条。
limit_conn_zone $binary_remote_addr zone=magi_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# --- 慢连接（slowloris 一类）-------------------------------------------------
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;
keepalive_requests 200;
client_body_buffer_size 16k;
client_header_buffer_size 4k;
large_client_header_buffers 4 8k;
client_max_body_size 256k;

# 不暴露版本号
server_tokens off;
