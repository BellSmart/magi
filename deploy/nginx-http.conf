# 引导用站点：只在证书签发之前生效。
#
# 除了 Let's Encrypt 的校验路径，其余请求一律拒绝——避免在 TLS 就绪前
# 让账号口令以明文过网。证书签发完成后，enable-tls.sh 会把它换成 nginx-tls.conf。

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503 "MAGI: TLS is not configured yet.\n";
    }
}
