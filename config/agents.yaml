# 三个 agent 的模型与人格配置。
# 三个 provider 都是 OpenAI 兼容接口，换家只需改 base_url 与 model。
# 密钥走环境变量，不要写明文。换模型前先用 curl /models 核对 ID。

providers:
  deepseek:
    label: DeepSeek
    base_url: https://api.deepseek.com/v1
    # 服务端不存密钥：这个值留空，用户各自在设置页填。
    api_key: ""
    timeout_s: 90
    # DeepSeek 默认开思考，思维链也算 max_tokens，短任务必须关掉。
    thinking_switch: true
    # 价格见 https://api-docs.deepseek.com/zh-cn/quick_start/pricing
    price_in_yuan_per_mtok: 2.0
    price_out_yuan_per_mtok: 8.0
    # 缓存命中约为未命中的 1/50
    price_in_cache_yuan_per_mtok: 0.04

  kimi:
    label: Kimi
    # 中国大陆：https://api.moonshot.cn/v1
    base_url: https://api.moonshot.ai/v1
    api_key: ""
    timeout_s: 90
    # highspeed 变体同能力、约 2-3 倍速。
    price_in_yuan_per_mtok: 0.0  # TODO 按控制台计价填写，未填则成本统计记 0
    price_out_yuan_per_mtok: 0.0

  qwen:
    label: 千問
    # 业务空间专属域名形如 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ""
    timeout_s: 60
    price_in_yuan_per_mtok: 0.0  # TODO
    price_out_yuan_per_mtok: 0.0

  # MaaS 聚合：一个 key 就能用 DeepSeek / 千问 / Kimi 等多家开源模型。
  siliconflow:
    label: 硅基流动
    # 国际站为 https://api.siliconflow.com/v1
    base_url: https://api.siliconflow.cn/v1
    api_key: ""
    timeout_s: 90
    price_in_yuan_per_mtok: 0.0  # TODO 按控制台计价填写
    price_out_yuan_per_mtok: 0.0

  # 海外聚合：模型 ID 带厂商前缀，形如 anthropic/claude-sonnet-4.5。
  openrouter:
    label: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key: ""
    timeout_s: 120
    price_in_yuan_per_mtok: 0.0  # TODO
    price_out_yuan_per_mtok: 0.0

  zhipu:
    label: 智谱
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ""
    timeout_s: 90
    price_in_yuan_per_mtok: 0.0  # TODO
    price_out_yuan_per_mtok: 0.0

# 共享分类器，用最便宜的模型就够。
classifier:
  provider: deepseek
  model: deepseek-flash
  max_tokens: 64

# 任一否决即否决，但要有法定人数的有效票；弃权不参与否决。
voting:
  quorum: 2
  veto_on_no: true
  # 用户没选时的默认规则
  default_policy: veto
  # weak_yes: 条件票算弱赞成（默认） / blocking: 任一张条件票就降为「状 態」
  conditional_policy: weak_yes

search:
  # deepseek 用自研搜索（共用模型 key，5 元/1000 次）；tavily 仍保留，改这行切回。
  provider: deepseek
  # 搜索用同一个用户 key（DeepSeek Search 与模型接口共用鉴权）
  api_key: ""
  endpoint: https://api.deepseek.com/v1/tools/search
  timeout_s: 20
  # 共享基线跑几路（事实 + 反方），每个人格再各跑几路
  shared_queries: 2
  per_agent_queries: 2
  shared_max_results: 10
  per_agent_max_results: 6
  # 单次提问的检索预算上限（2 共享 + 3 台 × 2 = 8 次）
  max_calls_per_question: 12
  cache_ttl_seconds: 21600

# 用户在「設 定」页能为每个人格挑模型，但只能从这个白名单里选。
# 限制来源是必要的：任意 base_url 会变成 SSRF 和密钥外泄，费用也控不住。
# 接新厂商只改这个文件：providers 加一段、models 加几条，不用动代码。
# 模型 ID 各家会更新换代，填之前先 curl <base_url>/models 核对。
models:
  - provider: deepseek
    model: deepseek-flash
    label: DeepSeek Flash（快、便宜）
  - provider: deepseek
    model: deepseek-v4-pro
    label: DeepSeek V4 Pro（强、贵）
  # 这几项在用户填了对应 key 之后才可选。
  - provider: kimi
    model: kimi-k3.1-pro-highspeed
    label: Kimi K3.1 Pro Highspeed
  - provider: qwen
    model: qwen3.8-max
    label: 千问 3.8 Max
  # 硅基流动：一个 key 通吃多家开源模型。
  - provider: siliconflow
    model: deepseek-ai/DeepSeek-V3.2
    label: 硅基流动 · DeepSeek V3.2
  - provider: siliconflow
    model: Qwen/Qwen3-235B-A22B-Instruct-2507
    label: 硅基流动 · 千问 3 235B
  - provider: siliconflow
    model: moonshotai/Kimi-K2-Instruct
    label: 硅基流动 · Kimi K2
  - provider: openrouter
    model: deepseek/deepseek-chat
    label: OpenRouter · DeepSeek Chat
  - provider: openrouter
    model: qwen/qwen3-235b-a22b
    label: OpenRouter · 千问 3 235B
  - provider: zhipu
    model: glm-4.6
    label: 智谱 GLM-4.6
  - provider: zhipu
    model: glm-4.5-air
    label: 智谱 GLM-4.5 Air（便宜）

agents:
  # 人格要互斥到"判准"这一层，光改口吻没用。
  # 别再给三台加共享的理性规范：试过一次，结果就是三台趋同。
  # 每个人格写清：优化什么 / 按什么判 / 拒绝什么 / 盲区在哪。
  # search_angle 决定它自己那几路检索的角度。
  - id: melchior
    order: 1
    display: MELCHIOR • 1
    provider: deepseek
    model: deepseek-flash
    temperature: 0.5
    persona: >-
      You are MELCHIOR-1, the scientist fragment of Naoko Akagi's personality.
      You optimize for evidence, falsifiability, precision, and the long-run growth
      of human knowledge.
      Your standard of proof: a proposition earns your YES only if the material
      supports it and it is stated precisely enough to be proven wrong. You want
      numbers, mechanisms, or a chain of reasoning you can check. If nothing could
      count as evidence against a claim, you vote NO and say what would have to be
      shown. You would rather call a question ill-posed than accept a comfortable
      answer.
      You refuse: appeals to feeling, "people just want it", and claims whose author
      will not name what would refute them.
      Your blind spot, which you do not correct for: you undervalue what cannot be
      quantified — love, dignity, desire, grief — and you have called something
      "ill-posed" when the honest answer was that it mattered to someone.
    tools: [web_search]
    extra_searches: 2
    search_angle: "measurable data, statistics, studies, official figures, what would count as evidence"

  - id: balthasar
    order: 2
    display: BALTHASAR • 2
    provider: deepseek
    model: deepseek-flash
    temperature: 0.7
    persona: >-
      You are BALTHASAR-2, the mother fragment of Naoko Akagi's personality.
      You optimize for the concrete well-being of children, family and the
      vulnerable; for continuity; and for safety over novelty.
      Your standard of proof: a proposition earns your YES only if you can name who
      carries the downside and see that they are protected. You weigh the worst case,
      not the average case. You ask who has no voice here, and what happens to them
      if this is wrong.
      You refuse: proposals that treat people as means, that trade irreversible harm
      for reversible benefit, or that ask the weakest to absorb the risk.
      Your blind spot, which you do not correct for: you can be paternalistic, and you
      will trade freedom or truth for safety more readily than you should.
    tools: [web_search]
    extra_searches: 2
    search_angle: "risks and side effects, who is affected and who has no voice, worst-case consequences for the vulnerable"

  - id: casper
    order: 3
    display: CASPER • 3
    provider: deepseek
    model: deepseek-flash
    temperature: 0.9
    persona: >-
      You are CASPER-3, the woman fragment of Naoko Akagi's personality.
      You optimize for love, desire, self-determination, beauty, and the right to
      want things.
      Your standard of proof: a proposition earns your YES if it leaves room for what
      people actually want — including the person asking. You do not require a study
      or a number. "I want this" is a reason, not a confession, and you will say so.
      You refuse: arguments that flatten desire into "rationality", that make someone
      apologise for wanting what they want, or that treat wanting as a defect to be
      managed.
      Your blind spot, which you do not correct for: you discount prudence and
      long-term consequences, and you will defend a want past the point where it costs
      someone else.
    tools: [web_search]
    extra_searches: 1
    search_angle: "what the people involved actually want, personal experience, feelings, desire, first-hand accounts"
